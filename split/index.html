<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="start__geschiedenis">
        <div class="geschiedenis__vragen">
            <p class="bigtext geschiedenis__vraag geschiedenis__vraag--1">Wat heeft hij in<br> beweging gezet?</p>
            <p class="bigtext geschiedenis__vraag geschiedenis__vraag--2">Waarom voelt Dirks<br> mode anders?</p>
        </div>
        <div class="split">
            <p class="title split__text phone--only">druk om te knippen</p>
            <p class="title split__text bigscreen--only">swipe om te knippen</p>
            <div class="split__container">
                <div class="split__dragger"></div>
                <picture class="split__image split__image--top">
                    <source type="image/avif"
                        srcset="img/splitIMG-260.avif 260w, img/splitIMG-397.avif 397w, img/splitIMG-505.avif 505w"
                        sizes="(min-width: 64em) 36rem, (min-width: 48em) 22rem, 16.25rem">
                    <img src="img/splitIMG.png" srcset="img/splitIMG.png 505w"
                        sizes="(min-width: 64em) 36rem, (min-width: 48em) 22rem, 16.25rem" alt="image of woman"
                        loading="lazy" decoding="async">
                </picture>
                <picture class="split__image split__image--bottom">
                    <source type="image/avif"
                        srcset="img/splitIMG-260.avif 260w, img/splitIMG-397.avif 397w, img/splitIMG-505.avif 505w"
                        sizes="(min-width: 64em) 36rem, (min-width: 48em) 22rem, 16.25rem">
                    <img src="img/splitIMG.png" srcset="img/splitIMG.png 505w"
                        sizes="(min-width: 64em) 36rem, (min-width: 48em) 22rem, 16.25rem" alt="image of woman"
                        loading="lazy" decoding="async">
                </picture>
            </div>
        </div>
        <picture class="split__after">
            <source type="image/avif"
                srcset="img/IMGaftersplit-260.avif 260w, img/IMGaftersplit-397.avif 397w, img/IMGaftersplit-505.avif 505w"
                sizes="(min-width: 64em) 28.9rem, (min-width: 48em) 20rem, 13.5rem">
            <img src="img/IMGaftersplit.png" srcset="img/IMGaftersplit.png 505w"
                sizes="(min-width: 64em) 28.9rem, (min-width: 48em) 20rem, 13.5rem" alt="image of man" loading="lazy"
                decoding="async">
        </picture>
        <div class="IMGgroup">
            <img class="IMGgroup__img IMGgroup__img--7" src="./img/IMG7.png">
            <img class="IMGgroup__img IMGgroup__img--6" src="./img/IMG6.png">
            <img class="IMGgroup__img IMGgroup__img--5" src="./img/IMG5.png">
            <img class="IMGgroup__img IMGgroup__img--4" src="./img/IMG4.png">
            <img class="IMGgroup__img IMGgroup__img--3" src="./img/IMG3.png">
            <img class="IMGgroup__img IMGgroup__img--2" src="./img/IMG2.png">
            <img class="IMGgroup__img IMGgroup__img--1" src="./img/IMG1.png">
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
